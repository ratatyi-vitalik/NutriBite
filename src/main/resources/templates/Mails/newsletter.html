<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tastebite Newsletter</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f8f9fa;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #2B2B2B;
    }

    .wrapper {
      width: 100%;
      background-color: #f8f9fa;
      padding: 30px 10px;
    }

    .email-card {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid #E8E8E8;
    }

    .email-header {
      background-color: #111111;
      padding: 32px 40px;
      text-align: center;
    }

    .brand-logo {
      font-family: Georgia, serif;
      font-size: 28px;
      font-weight: 700;
      color: #FFFFFF;
      text-decoration: none;
    }

    .brand-logo span {
      color: #FF6B00;
    }

    .header-tagline {
      color: #A0A0A0;
      font-size: 12px;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .hero-image {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      display: block;
    }

    .email-body {
      padding: 40px;
    }

    .news-badge {
      display: inline-block;
      background-color: #FFF2E8;
      color: #FF6B00;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .news-title {
      font-family: Georgia, serif;
      font-size: 24px;
      line-height: 1.3;
      color: #111111;
      margin: 0 0 20px 0;
      font-weight: 700;
    }

    .news-text {
      font-size: 15px;
      line-height: 1.6;
      color: #4A4A4A;
      margin-bottom: 24px;
    }

    .cta-container {
      text-align: center;
      margin: 32px 0 12px 0;
    }

    .btn-primary {
      display: inline-block;
      background-color: #FF6B00;
      color: #FFFFFF !important;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 30px;
    }

    .email-footer {
      background-color: #FAFAFA;
      padding: 28px 40px;
      text-align: center;
      border-top: 1px solid #E8E8E8;
    }

    .footer-text {
      font-size: 12px;
      line-height: 1.5;
      color: #8C8C8C;
      margin: 0 0 8px 0;
    }

    .unsubscribe-link {
      color: #8C8C8C;
      text-decoration: underline;
    }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="email-card">
    <div class="email-header">
      <a href="https://tastebite.com" class="brand-logo">Taste<span>bite</span></a>
      <div class="header-tagline">News & Recipes</div>
    </div>

    <div class="email-body">
      <span class="news-badge" th:text="${categoryName ?: 'Special Edition'}">Special Edition</span>
      <h1 class="news-title" th:text="${subject}">Your Newsletter Headline</h1>

      <div class="news-text" th:utext="${content}">
        Hello! Here goes the main story, recipe highlight, or special announcement.
      </div>

      <div class="cta-container" th:if="${ctaUrl != null and !ctaUrl.empty}">
        <a th:href="${ctaUrl}" class="btn-primary" th:text="${ctaText ?: 'Read More'}">Read More</a>
      </div>
    </div>

    <div class="email-footer">
      <div class="footer-text">
        You are receiving this email because you subscribed to the <strong>Tastebite</strong> newsletter.
      </div>
      <div class="footer-text">
        © Tastebite. All rights reserved.
      </div>
      <div class="footer-text" style="margin-top: 12px;">
        <a th:href="${unsubscribeUrl}" class="unsubscribe-link">Unsubscribe from this list</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
