<div th:fragment="list" xmlns:th="http://www.thymeleaf.org">

    <!-- Сетка рецептов -->
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" th:if="${recipesPage != null and !recipesPage.empty}">
        <div class="col" th:each="recipe : ${recipesPage.content}">
            <a th:href="@{/recipe?recipeId={id}(id=${recipe.id})}" class="recipe-card-link">
                <div class="recipe-card-img-wrapper position-relative">
                    <img th:src="@{{path}(path=${recipe.imagePath != null ? recipe.imagePath : '/images/default-recipe.jpg'})}"
                         th:alt="${recipe.title}"
                         class="recipe-card-img">

                    <div class="recipe-rating-badge position-absolute top-0 end-0 m-3 shadow-sm" th:if="${recipe.averageRating > 0}">
                        <i class="bi bi-star-fill text-warning fs-6"></i>
                        <span th:text="${#numbers.formatDecimal(recipe.averageRating, 1, 1)}">4.5</span>
                    </div>
                </div>

                <div class="mt-3">
                    <h3 class="recipe-card-title text-truncate d-block"
                        th:text="${recipe.title}"
                        th:title="${recipe.title}">Recipe Title</h3>

                    <div class="d-flex align-items-center justify-content-between gap-2 mt-2 text-muted fs-6">
                        <span th:if="${recipe.prepTime != null or recipe.cookTime != null}">
                            <i class="bi bi-clock me-1"></i>
                            <span th:text="${recipe.formattedCookTimePlusPrepTime}">30 mins</span>
                        </span>

                        <span class="badge bg-light text-dark fw-normal" th:if="${recipe.category != null}" th:text="${recipe.category.name}">Category</span>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <!-- Нет рецептов -->
    <div class="text-center py-5" th:if="${recipesPage == null or recipesPage.empty}">
        <p class="text-muted fs-5">No recipes found according to selected filters.</p>
    </div>

    <!-- AJAX Пагинация -->
    <div class="d-flex justify-content-center mt-5" th:if="${recipesPage != null and recipesPage.totalPages > 1}">
        <nav aria-label="Page navigation">
            <ul class="pagination">
                <!-- Назад -->
                <li class="page-item" th:classappend="${recipesPage.first} ? 'disabled'">
                    <a class="page-link page-link-ajax text-dark" href="#" th:data-page="${recipesPage.number - 1}">
                        <span aria-hidden="true">&laquo;</span>
                    </a>
                </li>

                <!-- Страницы -->
                <li class="page-item"
                    th:each="i : ${#numbers.sequence(0, recipesPage.totalPages - 1)}"
                    th:classappend="${i == recipesPage.number} ? 'active'">
                    <a class="page-link page-link-ajax"
                       href="#"
                       th:data-page="${i}"
                       th:text="${i + 1}">1</a>
                </li>

                <!-- Вперед -->
                <li class="page-item" th:classappend="${recipesPage.last} ? 'disabled'">
                    <a class="page-link page-link-ajax text-dark" href="#" th:data-page="${recipesPage.number + 1}">
                        <span aria-hidden="true">&raquo;</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>

</div>
