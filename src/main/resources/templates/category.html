<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${category.name} + ' — Рецепты NutriBite'">Category</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="flex-grow-1 py-5">
    <div class="container">

        <div class="text-center mb-5">
            <h1 class="h2 fw-bold text-dark mb-2" th:text="${category.name}">Торты</h1>
            <p class="text-muted">Все проверенные рецепты из этой категории</p>
        </div>

        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">

            <div class="col" th:each="recipe : ${category.recipes}">

                <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden hover-lift">
                    <a th:href="@{/recipe?recipeId={id}(id=${recipe.id})}" class="text-decoration-none text-dark">

                        <div class="ratio ratio-4x3 overflow-hidden">
                            <img th:src="@{{path}(path=${recipe.imagePath})}"
                                 th:alt="${recipe.title}"
                                 class="card-img-top object-fit-cover">
                        </div>

                        <div class="card-body p-3">
                            <h2 class="h6 card-title fw-bold text-dark mb-0 line-clamp-2" th:text="${recipe.title}">Изысканный малиновый торт</h2>
                        </div>

                    </a>
                </div>

            </div>

        </div>

        <div class="text-center py-5" th:if="${#lists.isEmpty(category.recipes)}">
            <i class="bi bi-journal-x display-4 text-muted d-block mb-3"></i>
            <p class="text-muted fs-5">В этой категории пока нет опубликованных рецептов.</p>
        </div>

    </div>
</main>

<div th:replace="~{fragments/header :: modalSignUp}"></div>
<div th:replace="~{fragments/header :: modalRegister}"></div>
<div th:replace="~{fragments/header :: modalForgot}"></div>

<div th:replace="~{fragments/footer :: successToast}"></div>
<div th:replace="~{fragments/footer :: errorToast}"></div>
<script th:replace="~{fragments/footer :: toastScript}"></script>

<script th:replace="~{fragments/header :: searchScript}"></script>
<script th:replace="~{fragments/header :: openLoginScript}"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
