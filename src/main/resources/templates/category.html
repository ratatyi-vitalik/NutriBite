<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${category.name} + ' Recipes - Tastebite'">Cakes Recipes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Подключение шапки сайта -->
<div th:replace="~{fragments/header :: header}"></div>

<main class="category-recipes-section">
    <div class="container">

        <!-- Заголовок с названием выбранной категории -->
        <h1 class="page-title-categories" th:text="${category.name}">Cakes</h1>

        <!-- Сетка рецептов: 4 колонки на десктопе, 2 на мобильных -->
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">

            <!-- Цикл по коллекции рецептов, принадлежащих этой категории -->
            <div class="col" th:each="recipe : ${category.recipes}">

                <!-- Ссылка на страницу конкретного рецепта -->
                <a th:href="@{/recipe?recipeId={id}(id=${recipe.id})}" class="recipe-card-link">

                    <!-- Прямоугольное превью изображения рецепта -->
                    <div class="recipe-card-img-wrapper">
                        <img th:src="@{{path}(path=${recipe.imagePath})}"
                             th:alt="${recipe.title}"
                             class="recipe-card-img">
                    </div>

                    <!-- Название рецепта полужирным шрифтом Inter -->
                    <h2 class="recipe-card-title" th:text="${recipe.title}">Decadent Raspberry and Cream Cake</h2>

                </a>

            </div>

        </div>

        <!-- Вывод сообщения, если в категории пока нет рецептов -->
        <div class="text-center py-5" th:if="${#lists.isEmpty(category.recipes)}">
            <p class="text-muted">No recipes found in this category yet.</p>
        </div>

    </div>
</main>

<div th:replace="~{fragments/header :: modalSignUp}"></div>

<div th:replace="~{fragments/header :: modalRegister}"></div>

<div th:replace="~{fragments/header :: modalForgot}"></div>

<script th:replace="~{fragments/header :: searchScript}"></script>

<script th:replace="~{fragments/header :: openLoginScript}"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
