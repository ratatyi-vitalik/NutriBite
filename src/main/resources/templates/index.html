<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ресторан</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="custom-navbar">
    <div class="container">
        <div class="row align-items-center">

            <div class="col-3 col-lg-2">
                <div>
                    <img th:src="@{/icons/Logo.svg}" alt="logo">
                </div>
            </div>

            <div class="col-6 col-lg-8 d-none d-md-block">
                <ul class="nav justify-content-center navbar-nav flex-row">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Homepage
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-menu-item dropdown-item" href="#">Action</a></li>
                        </ul>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Recipe Page
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Sub Recipe</a></li>
                        </ul>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Pages
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">About Us</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Buy</a>
                    </li>
                </ul>
            </div>

            <div class="col-3 col-lg-2 d-flex align-items-center justify-content-end gap-4">
                <button class="search-btn" type="button" aria-label="Search">
                    <i class="bi bi-search"></i>
                </button>

                <div class="auth-buttons-block d-flex" th:if="${user == null}">
                    <button class="btn btn-login" data-bs-toggle="modal" data-bs-target="#loginModal">Войти</button>
                    <button class="btn btn-register" data-bs-toggle="modal" data-bs-target="#registerModal">Регистрация</button>
                </div>

                <div class="profile-block" th:unless="${user == null}">
                    <img th:src="@{/images/32px.png}" alt="profile" class="rounded-circle" style="width: 32px; height: 32px; object-fit: cover;">[cite: 1]
                </div>

            </div>

        </div>
    </div>
</header>

<div class="modal fade custom-modal" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 400px;">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="loginModalLabel">LOGIN</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form th:action="@{/login}" method="POST">
                    <div class="input-group-custom">
                        <i class="bi bi-envelope"></i>
                        <input type="email" class="form-control-custom" id="loginEmail" name="username" required placeholder="Email">
                    </div>

                    <div class="input-group-custom">
                        <i class="bi bi-lock"></i>
                        <input type="password" class="form-control-custom" id="loginPassword" name="password" required placeholder="Password">
                    </div>

                    <a href="#" class="forgot-link">Forgot Password?</a>

                    <button type="submit" class="btn btn-orange">Login</button>

                    <div class="modal-footer-text">
                        Don’t have an account? <a href="#" data-bs-toggle="modal" data-bs-target="#registerModal">Sign up</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="modal fade custom-modal" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 400px;">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="registerModalLabel">SIGN UP</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form th:action="@{/register}" method="POST">
                    <div class="input-group-custom">
                        <i class="bi bi-person"></i>
                        <input type="text" class="form-control-custom" id="regName" name="name" required placeholder="Full Name">
                    </div>

                    <div class="input-group-custom">
                        <i class="bi bi-envelope"></i>
                        <input type="email" class="form-control-custom" id="regEmail" name="email" required placeholder="Email">
                    </div>

                    <div class="input-group-custom">
                        <i class="bi bi-lock"></i>
                        <input type="password" class="form-control-custom" id="regPassword" name="password" required placeholder="Password">
                    </div>

                    <button type="submit" class="btn btn-orange">Sign up</button>

                    <div class="terms-text">
                        By creating an account, you agree to our <a href="#">Terms & Conditions</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
