<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Profile</title>
</head>
<body>

<header class="custom-navbar" th:fragment="navbar">
    <div class="container">
        <div class="row align-items-center">

            <div class="col-3 col-lg-2">
                <a href="/" class="d-flex align-items-center text-decoration-none">
                    <img th:src="@{/icons/Logo.svg}" alt="NutriBite Organic" style="max-height: 50px;">
                </a>
            </div>

            <div class="col-6 col-lg-7 d-none d-md-block">
                <ul class="nav justify-content-center navbar-nav flex-row gap-lg-3">
                    <li class="nav-item">
                        <a class="nav-link" href="/profile/favourites">
                            Избранные
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/profile/notifications">
                            Уведомления
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link position-relative" href="#" id="notificationsDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-bell fs-5"></i>
                            <span th:if="${unreadNotificationsCount > 0}"
                                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-success"
                                  th:text="${unreadNotificationsCount}">
                                3
                            </span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow p-2" aria-labelledby="notificationsDropdown" style="width: 320px; max-height: 400px; overflow-y: auto;">
                            <li class="dropdown-header d-flex justify-content-between align-items-center border-bottom pb-2 mb-2">
                                <span class="fw-bold">Уведомления</span>
                                <a href="/notifications/mark-all-read" class="text-decoration-none font-size-12 text-success">Прочитать все</a>
                            </li>

                            <li th:each="notif : ${notifications}" class="mb-2">
                                <a th:if="${notif.link != null}"
                                   th:href="${notif.link}"
                                   class="dropdown-item rounded p-2 text-wrap">
                                    <div class="d-flex align-items-start gap-2">
                                        <div>
                                            <p class="mb-0 font-size-14 fw-medium" th:text="${notif.title}"></p>
                                            <small class="text-muted d-block" th:text="${notif.message}"></small>
                                        </div>
                                    </div>
                                </a>

                                <div th:unless="${notif.link != null}"
                                     class="dropdown-item-text rounded p-2 text-wrap">
                                    <div class="d-flex align-items-start gap-2">
                                        <div>
                                            <p class="mb-0 font-size-14 fw-medium" th:text="${notif.title}"></p>
                                            <small class="text-muted d-block" th:text="${notif.message}"></small>
                                        </div>
                                    </div>
                                </div>
                            </li>

                            <li th:if="${#lists.isEmpty(notifications)}" class="text-center py-3 text-muted">
                                Нет новых уведомлений
                            </li>

                            <li class="border-top pt-2 mt-2 text-center">
                                <a href="/profile/notifications" class="text-decoration-none font-size-14 fw-semibold text-success">Все уведомления</a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>

        </div>
    </div>
</header>

<main class="profile-section py-5">
    <div class="container">

        <form th:action="@{/profile}" th:object="${user}" method="POST" class="profile-form bg-white p-4 p-md-5 rounded-3 shadow-sm" enctype="multipart/form-data">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="profile-header-title h3 fw-bold text-dark m-0">Мой профиль</h1>
            </div>

            <hr class="mb-4" style="color: #E8E8E8;">

            <!-- Аватар -->
            <div class="d-flex align-items-center gap-4 mb-5">
                <img th:src="${user.avatarPath != null ? user.avatarPath : '/icons/avatar.png'}"
                     alt="Аватар" class="profile-avatar-lg" style="width: 90px; height: 90px; object-fit: cover;">

                <div class="d-flex gap-2">
                    <input type="file" id="pfpInput" name="file" accept="image/png, image/jpeg" style="display: none;">
                    <button type="button" class="btn btn-success rounded-pill px-3" onclick="document.getElementById('pfpInput').click()">Изменить фото</button>
                    <button type="button" class="btn btn-outline-danger rounded-pill px-3" onclick="this.form.action='/deletePFP'; this.form.submit();">Удалить</button>
                </div>
            </div>

            <!-- Данные профиля -->
            <div class="row col-lg-12">
                <div class="col-md-6 mb-3">
                    <label class="form-label font-size-14 fw-medium text-muted">Полное имя</label>
                    <div class="input-group-custom form-group-custom d-flex align-items-center border rounded-3 px-3 py-1">
                        <i class="bi bi-person text-muted me-2"></i>
                        <input type="text" class="form-control border-0 shadow-none" id="profileName" name="name"
                               th:value="${user.fullName}" th:data-original="${user.fullName}"
                               placeholder="Полное имя" required oninput="checkChanges('profileName', 'btnName')">
                        <button id="btnName" class="field-link btn btn-link text-success text-decoration-none fw-semibold p-0" disabled
                                onclick="this.form.action='/saveName'; this.form.submit();">Сохранить</button>
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label font-size-14 fw-medium text-muted">Имя пользователя (Никнейм)</label>
                    <div class="input-group-custom form-group-custom d-flex align-items-center border rounded-3 px-3 py-1">
                        <i class="bi bi-at text-muted me-2"></i>
                        <input type="text" class="form-control border-0 shadow-none" id="profileUsername" name="username"
                               th:value="${user.name}" th:data-original="${user.name}"
                               placeholder="Никнейм" oninput="checkChanges('profileUsername', 'btnUsername')">
                        <button id="btnUsername" class="field-link btn btn-link text-success text-decoration-none fw-semibold p-0" disabled
                                onclick="this.form.action='/saveUsername'; this.form.submit();">Сохранить</button>
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label font-size-14 fw-medium text-muted">Email адрес</label>
                    <div class="input-group-custom form-group-custom d-flex align-items-center border rounded-3 px-3 py-1">
                        <i class="bi bi-envelope text-muted me-2"></i>
                        <input type="email" class="form-control border-0 shadow-none bg-transparent" id="profileEmail" name="email"
                               th:value="${user.email}" placeholder="Email" required readonly>
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label font-size-14 fw-medium text-muted">Пароль</label>
                    <div class="input-group-custom form-group-custom d-flex align-items-center border rounded-3 px-3 py-1">
                        <i class="bi bi-shield-lock text-muted me-2"></i>
                        <input type="password" class="form-control border-0 shadow-none text-muted bg-transparent" value="•••••••" readonly>
                        <a href="#" class="field-link text-success text-decoration-none fw-semibold" data-bs-toggle="modal" data-bs-target="#changePasswordModal">Изменить</a>
                    </div>
                </div>
            </div>

        </form>

        <!-- Рассылка -->
        <div class="row col-lg-12 my-4">
            <div class="col-12">
                <div class="bg-white p-4 rounded-3 shadow-sm">
                    <h3 class="h5 fw-bold text-dark mb-3">ПП-Рассылка</h3>
                    <div class="newsletter-box d-flex justify-content-between align-items-center" th:if="${user.subscribed}">
                        <span class="text-muted font-size-14">Вы подписаны на еженедельные рецепты и рекомендации.</span>
                        <form th:action="@{/profile-unsubscribe}" method="post">
                            <button class="btn btn-outline-danger btn-sm rounded-pill px-3">Отписаться</button>
                        </form>
                    </div>
                    <div class="newsletter-box d-flex justify-content-between align-items-center" th:unless="${user.subscribed}">
                        <span class="text-muted font-size-14">Вы пока не подписаны на обновления полезных рецептов.</span>
                        <form th:action="@{/profile-subscribe}" method="post">
                            <button class="btn btn-success btn-sm rounded-pill px-3">Подписаться</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Выход и Удаление -->
        <div class="row col-lg-12 pt-2">
            <div class="col-12 d-flex justify-content-between align-items-center">
                <form th:action="@{/logout}" method="POST" class="m-0">
                    <button type="submit" class="btn btn-outline-secondary rounded-pill d-flex align-items-center gap-2 px-3">
                        <i class="bi bi-box-arrow-left fs-5"></i> Выйти из аккаунта
                    </button>
                </form>
                <form th:action="@{/profile/delete}" method="post">
                    <button type="submit" class="btn btn-link text-danger text-decoration-none small">Удалить профиль</button>
                </form>
            </div>
        </div>

    </div>
</main>

<div class="modal fade custom-modal" id="changePasswordModal" tabindex="-1" aria-labelledby="changePasswordModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 400px;">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold text-success" id="changePasswordModalLabel">Смена пароля</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div th:if="${ChangePassError}" class="alert alert-danger mx-3 mt-2 mb-0">
                <p class="m-0 font-size-14" th:text="${ChangePassError}"></p>
            </div>
            <div class="modal-body p-4">
                <form th:action="@{/profile/change-password}" method="POST">

                    <div class="input-group-custom mb-3 border rounded-3 p-2 d-flex align-items-center">
                        <i class="bi bi-shield-lock text-muted me-2"></i>
                        <input type="password" class="form-control border-0 shadow-none p-0" id="oldPassword" name="oldPassword" required placeholder="Старый пароль">
                    </div>

                    <div class="input-group-custom mb-3 border rounded-3 p-2 d-flex align-items-center">
                        <i class="bi bi-lock text-muted me-2"></i>
                        <input type="password" class="form-control border-0 shadow-none p-0" id="newPassword" name="newPassword" required placeholder="Новый пароль">
                    </div>

                    <div class="input-group-custom mb-3 border rounded-3 p-2 d-flex align-items-center">
                        <i class="bi bi-lock-fill text-muted me-2"></i>
                        <input type="password" class="form-control border-0 shadow-none p-0" id="confirmPassword" name="confirmPassword" required placeholder="Повторите новый пароль">
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2 rounded-3 mt-2">Сохранить пароль</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<div th:replace="~{fragments/footer :: successToast}"></div>
<div th:replace="~{fragments/footer :: errorToast}"></div>

<div th:replace="~{fragments/footer :: modalBanned}"></div>
<script th:replace="~{fragments/footer :: bannedScript}"></script>

<script th:replace="~{fragments/footer :: toastScript}"></script>

<script th:if="${ChangePassError}">
    document.addEventListener("DOMContentLoaded", function() {
        var myModal = new bootstrap.Modal(document.getElementById('changePasswordModal'));
        myModal.show();
    });
</script>

<script>
    function checkChanges(inputId, buttonId) {
        const input = document.getElementById(inputId);
        const button = document.getElementById(buttonId);
        const originalValue = input.getAttribute('data-original');
        button.disabled = (input.value === originalValue);
    }
</script>

<!-- check banned -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // 1. Защита всех обычных HTML-форм (изменение имени, логина, пароля, подписки, удаления)
        const forms = document.querySelectorAll("form");
        forms.forEach(form => {
            // Пропускаем форму выхода из системы
            if (form.getAttribute("action")?.includes("/logout")) return;

            form.addEventListener("submit", function (e) {
                e.preventDefault();
                checkBanAndExecute(() => {
                    form.submit();
                });
            });
        });

        // 2. Защита смены аватара (Change photo)
        const pfpInput = document.getElementById("pfpInput");
        if (pfpInput) {
            // Удаляем старый инлайн-атрибут onchange из HTML
            pfpInput.removeAttribute("onchange");

            pfpInput.addEventListener("change", function () {
                if (this.files.length > 0) {
                    checkBanAndExecute(() => {
                        const form = this.form;
                        form.action = '/changePFP';
                        form.submit();
                    });
                }
            });
        }

        // 3. Защита кнопки "Delete" фото
        const deletePfpBtn = document.querySelector("button[onclick*='/deletePFP']");
        if (deletePfpBtn) {
            deletePfpBtn.removeAttribute("onclick"); // Удаляем инлайн onclick
            deletePfpBtn.addEventListener("click", function () {
                checkBanAndExecute(() => {
                    const form = this.form;
                    form.action = '/deletePFP';
                    form.submit();
                });
            });
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
