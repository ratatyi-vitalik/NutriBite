<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Profile</title>
</head>
<body>

<header class="custom-navbar">
    <div class="container">
        <div class="row align-items-center">

            <div class="col-3 col-lg-2">
                <a href="/">
                    <img th:src="@{/icons/Logo.svg}" alt="logo">
                </a>
            </div>

            <div class="col-6 col-lg-8 d-none d-md-block">
                <ul class="nav justify-content-center navbar-nav flex-row">
                    <li class="nav-item">
                        <a class="nav-link" href="/profile/favourites">
                            Favourites
                        </a>
                    </li>
                </ul>
            </div>

        </div>
    </div>
</header>

<main class="profile-section">
    <div class="container">

        <form th:action="@{/profile}" th:object="${user}" method="POST" class="profile-form" enctype="multipart/form-data">

            <div class="d-flex justify-content-between align-items-center mb-5">
                <h1 class="profile-header-title m-0">Profile</h1>
            </div>

            <hr class="mb-5" style="color: #E8E8E8;">

            <div class="d-flex align-items-center gap-4 mb-5">
                <img th:src="${user.avatarPath != null ? user.avatarPath : '/icons/avatar.png'}"
                     alt="Avatar" class="profile-avatar-lg">

                <div class="d-flex gap-3">
                    <input type="file" id="pfpInput" name="file" accept="image/png, image/jpeg" style="display: none;" onchange="this.form.action='/changePFP'; this.form.submit();">
                    <button type="button" class="btn btn-tb-orange" onclick="document.getElementById('pfpInput').click()">Change photo</button>
                    <button onclick="this.form.action='/deletePFP'; this.form.submit();" type="button" class="btn btn-tb-outline">Delete</button>
                </div>
            </div>

            <div class="row col-lg-12">
                <div class="col-md-6 mb-3">
                    <label class="form-label-top">Full Name</label>
                    <div class="input-group-custom form-group-custom">
                        <i class="bi bi-person"></i>
                        <input type="text" class="form-control-custom" id="profileName" name="name"
                               th:value="${user.fullName}" th:data-original="${user.fullName}"
                               placeholder="Full Name" required oninput="checkChanges('profileName', 'btnName')">
                        <button id="btnName" class="field-link btn btn-link" disabled
                                onclick="this.form.action='/saveName'; this.form.submit();">Save</button>
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label-top">Username</label>
                    <div class="input-group-custom form-group-custom">
                        <i class="bi bi-at"></i>
                        <input type="text" class="form-control-custom" id="profileUsername" name="username"
                               th:value="${user.name}" th:data-original="${user.name}"
                               placeholder="Username" oninput="checkChanges('profileUsername', 'btnUsername')">
                        <button id="btnUsername" class="field-link btn btn-link" disabled
                                onclick="this.form.action='/saveUsername'; this.form.submit();">Save</button>
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label-top">Email</label>
                    <div class="input-group-custom form-group-custom">
                        <i class="bi bi-envelope"></i>
                        <input type="email" class="form-control-custom" id="profileEmail" name="email"
                               th:value="${user.email}" placeholder="Email" required>
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label-top">Password</label>
                    <div class="input-group-custom form-group-custom">
                        <i class="bi bi-envelope"></i>
                        <input type="password" class="form-control-custom text-muted" value="•••••••" readonly>
                        <a class="field-link" data-bs-toggle="modal" data-bs-target="#changePasswordModal">Change</a>
                    </div>
                </div>
            </div>

        </form>

        <!--<div class="row col-lg-10">
            <div class="col-12">
                <h3 class="profile-subsection-title">Connected Accounts</h3>

                <div class="account-row d-flex justify-content-between align-items-center">
                    <div>
                        <div class="account-brand-logo fb">facebook</div>
                        <div class="account-user-info" th:text="${user.fbName != null ? user.fbName : 'Not connected'}">Suzan Miller</div>
                    </div>
                    <button type="button" class="btn-disconnect">Disconnect</button>
                </div>

                <div class="account-row d-flex justify-content-between align-items-center">
                    <div>
                        <div class="account-brand-logo google">Google</div>
                        <div class="account-user-info" th:text="${user.email}">suzan@gmail.com</div>
                    </div>
                    <button type="button" class="btn-disconnect">Disconnect</button>
                </div>
            </div>
        </div>-->

        <div class="row col-lg-12 mb-5">
            <div class="col-12">
                <h3 class="profile-subsection-title">Newsletter</h3>
                <div class="newsletter-box d-flex justify-content-between align-items-center" th:if="${user.subscribed}">
                    <span class="text-muted font-size-14">You are currently subscribed to our newsletter</span>
                    <form th:action="@{/profile-unsubscribe}" method="post">
                        <button class="btn btn-tb-outline">Unsubscribe</button>
                    </form>
                </div>
                <div class="newsletter-box d-flex justify-content-between align-items-center" th:unless="${user.subscribed}">
                    <span class="text-muted font-size-14">You are not currently subscribed to our newsletter</span>
                    <form th:action="@{/profile-subscribe}" method="post">
                        <button class="btn btn-tb-orange">Subscribe</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="row col-lg-12 pt-2">
            <div class="col-12 d-flex justify-content-between align-items-center">
                <form th:action="@{/logout}" method="POST" class="m-0">
                    <button type="submit" class="btn-signout d-flex align-items-center gap-2">
                        <i class="bi bi-box-arrow-left fs-5"></i> Sign out
                    </button>
                </form>
                <form th:action="@{/profile/delete}" method="post">
                    <button type="submit" class="btn-delete-acc">Удалить профиль</button>
                </form>
            </div>
        </div>

    </div>
</main>

<div class="modal fade custom-modal" id="changePasswordModal" tabindex="-1" aria-labelledby="changePasswordModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 400px;">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="changePasswordModalLabel">CHANGE PASSWORD</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div th:if="${ChangePassError}" class="alert alert-danger">
                <p style="margin: 0;" th:text="${ChangePassError}"></p>
            </div>
            <div class="modal-body">
                <form th:action="@{/profile/change-password}" method="POST">

                    <div class="input-group-custom">
                        <i class="bi bi-shield-lock"></i>
                        <input type="password" class="form-control-custom" id="oldPassword" name="oldPassword" required placeholder="Old Password">
                    </div>

                    <div class="input-group-custom">
                        <i class="bi bi-lock"></i>
                        <input type="password" class="form-control-custom" id="newPassword" name="newPassword" required placeholder="New Password">
                    </div>

                    <div class="input-group-custom">
                        <i class="bi bi-lock"></i>
                        <input type="password" class="form-control-custom" id="confirmPassword" name="confirmPassword" required placeholder="Confirm New Password">
                    </div>

                    <button type="submit" class="btn btn-orange">Change</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: successToast}"></div>
<div th:replace="~{fragments/footer :: errorToast}"></div>

<div th:replace="~{fragments/footer :: modalBanned}"></div>
<script th:replace="~{fragments/footer :: bannedScript}"></script>

<script th:replace="~{fragments/footer :: toastScript}"></script>

<script th:if="${ChangePassError}">
    document.addEventListener("DOMContentLoaded", function() {
        var myModal = new bootstrap.Modal(document.getElementById('changePasswordModal'));
        myModal.show();
    });
</script>

<script>
    function checkChanges(inputId, buttonId) {
        const input = document.getElementById(inputId);
        const button = document.getElementById(buttonId);
        const originalValue = input.getAttribute('data-original');
        button.disabled = (input.value === originalValue);
    }
</script>

<!-- check banned -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // 1. Защита всех обычных HTML-форм (изменение имени, логина, пароля, подписки, удаления)
        const forms = document.querySelectorAll("form");
        forms.forEach(form => {
            // Пропускаем форму выхода из системы
            if (form.getAttribute("action")?.includes("/logout")) return;

            form.addEventListener("submit", function (e) {
                e.preventDefault();
                checkBanAndExecute(() => {
                    form.submit();
                });
            });
        });

        // 2. Защита смены аватара (Change photo)
        const pfpInput = document.getElementById("pfpInput");
        if (pfpInput) {
            // Удаляем старый инлайн-атрибут onchange из HTML
            pfpInput.removeAttribute("onchange");

            pfpInput.addEventListener("change", function () {
                if (this.files.length > 0) {
                    checkBanAndExecute(() => {
                        const form = this.form;
                        form.action = '/changePFP';
                        form.submit();
                    });
                }
            });
        }

        // 3. Защита кнопки "Delete" фото
        const deletePfpBtn = document.querySelector("button[onclick*='/deletePFP']");
        if (deletePfpBtn) {
            deletePfpBtn.removeAttribute("onclick"); // Удаляем инлайн onclick
            deletePfpBtn.addEventListener("click", function () {
                checkBanAndExecute(() => {
                    const form = this.form;
                    form.action = '/deletePFP';
                    form.submit();
                });
            });
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
