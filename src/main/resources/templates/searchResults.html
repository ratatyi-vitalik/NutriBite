<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результаты поиска — NutriBite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<main class="flex-grow-1 py-5">
    <div class="container">
        <div class="text-center mb-4">
            <h1 class="h2 fw-bold text-dark mb-2">Результаты поиска</h1>
            <p class="text-muted">Найдите идеальные полезные рецепты для вашего рациона</p>
        </div>

        <!-- Верхняя поисковая строка -->
        <div class="row justify-content-center mb-5">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm p-2 rounded-pill bg-white">
                    <div class="input-group align-items-center px-3">
                        <i class="bi bi-search text-success fs-5 me-2"></i>
                        <input type="text" id="pageSearchInput" class="form-control border-0 shadow-none bg-transparent" placeholder="Введите название или ингредиент...">
                        <span class="badge bg-light text-muted rounded-pill px-3 py-2 me-2" id="searchStats">(0 Рецептов)</span>
                        <button class="btn btn-link text-muted p-0 me-1" id="pageSearchClearBtn" type="button"><i class="bi bi-x-circle-fill fs-5"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Контейнер сетки результатов (4 колонки на больших экранах) -->
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="searchResultsGrid">
            <!-- Динамически рендерятся рецепты -->
        </div>

        <div class="text-center mt-5 d-none" id="loadMoreContainer">
            <button class="btn btn-outline-success rounded-pill px-5 py-2 fw-semibold" id="loadMoreBtn">Загрузить еще</button>
        </div>
    </div>
</main>

<div th:replace="~{fragments/header :: modalSignUp}"></div>
<div th:replace="~{fragments/header :: modalRegister}"></div>
<div th:replace="~{fragments/header :: modalForgot}"></div>

<div th:replace="~{fragments/footer :: successToast}"></div>
<div th:replace="~{fragments/footer :: errorToast}"></div>
<script th:replace="~{fragments/footer :: toastScript}"></script>

<script th:replace="~{fragments/header :: searchScript}"></script>
<script th:replace="~{fragments/header :: openLoginScript}"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const pageSearchInput = document.getElementById("pageSearchInput");
        const pageSearchClearBtn = document.getElementById("pageSearchClearBtn");
        const searchStats = document.getElementById("searchStats");
        const searchResultsGrid = document.getElementById("searchResultsGrid");
        const loadMoreContainer = document.getElementById("loadMoreContainer");
        const loadMoreBtn = document.getElementById("loadMoreBtn");

        let currentQuery = "";
        let currentPage = 0;
        const pageSize = 20;

        // Извлекаем query параметр из URL при первой загрузке страницы
        const urlParams = new URLSearchParams(window.location.search);
        const queryParam = urlParams.get('query');

        if (queryParam) {
            currentQuery = queryParam.trim();
            pageSearchInput.value = currentQuery;
            executeSearch(currentQuery, false);
        }

        // Кнопка Load More
        loadMoreBtn.addEventListener("click", function () {
            currentPage++;
            executeSearch(currentQuery, true); // true означает дозагрузку (append)
        });

        // Очистить строку
        pageSearchClearBtn.addEventListener("click", function() {
            pageSearchInput.value = "";
            searchResultsGrid.innerHTML = "";
            searchStats.textContent = "(0 Рецептов)";
            loadMoreContainer.classList.add("d-none");
            currentQuery = "";
        });

        // Живой поиск прямо на этой странице с дебаунсом
        function debounce(func, delay = 400) {
            let timeoutId;
            return (...args) => {
                clearTimeout(timeoutId);
                timeoutId = setTimeout(() => { func.apply(this, args); }, delay);
            };
        }

        pageSearchInput.addEventListener("input", debounce(function() {
            const query = pageSearchInput.value.trim();
            if (query === currentQuery) return;

            currentQuery = query;
            currentPage = 0; // Сбрасываем страницу на первую при новом поиске

            if (currentQuery.length === 0) {
                searchResultsGrid.innerHTML = "";
                searchStats.textContent = "(0 Рецептов)";
                loadMoreContainer.classList.add("d-none");
                return;
            }

            executeSearch(currentQuery, false);
        }));

        function executeSearch(query, appendMode) {
            fetch(`/search-page?query=${encodeURIComponent(query)}&page=${currentPage}`)
                .then(response => response.json())
                .then(data => {
                    renderPageResults(data, appendMode);
                })
                .catch(err => console.error("Error fetching search results:", err));
        }

        function renderPageResults(data, appendMode) {
            if (!appendMode) {
                searchResultsGrid.innerHTML = "";
            }

            const recipes = data.recipes || [];
            const totalRecipes = data.totalRecipes || 0;
            const totalPages = data.totalPages || 0;

            searchStats.textContent = `(${totalRecipes} ${totalRecipes === 1 ? 'Рецепт' : totalRecipes > 1 && totalRecipes < 5 ? 'Рецепта' : 'Рецептов'})`;

            if (recipes.length === 0 && !appendMode) {
                searchResultsGrid.innerHTML = `<div class="col-12 text-center text-muted py-5"><i class="bi bi-search display-4 d-block mb-3 text-secondary"></i>По вашему запросу ничего не найдено.</div>`;
                loadMoreContainer.classList.add("d-none");
                return;
            }

            // Рендер карточек рецептов в сетку
            recipes.forEach(recipe => {
                const col = document.createElement("div");
                col.className = "col";
                col.innerHTML = `
                    <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden text-decoration-none hover-lift">
                        <a href="/recipe?recipeId=${recipe.id}" class="text-decoration-none text-dark">
                            <div class="ratio ratio-4x3 overflow-hidden">
                                <img src="${recipe.imagePath ? recipe.imagePath : '/icons/avatar.png'}" class="card-img-top object-fit-cover" alt="${recipe.title}">
                            </div>
                            <div class="card-body p-3">
                                <h3 class="h6 card-title fw-bold text-dark mb-0 line-clamp-2">${recipe.title}</h3>
                            </div>
                        </a>
                    </div>
                `;
                searchResultsGrid.appendChild(col);
            });

            if (currentPage + 1 < totalPages) {
                loadMoreContainer.classList.remove("d-none");
            } else {
                loadMoreContainer.classList.add("d-none");
            }
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
