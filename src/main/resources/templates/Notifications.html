<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Notifications</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-bell-fill me-2"></i>Notifications</h2>
        <a href="/notifications/mark-all-read" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-check2-all me-1"></i>Mark all as read
        </a>
    </div>

    <!-- Notification List -->
    <div class="list-group mb-4 shadow-sm" th:if="${notificationPage.hasContent()}">
        <div th:each="notification : ${notificationPage.content}"
             class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
             th:classappend="${!notification.isRead} ? 'list-group-item-light fw-bold' : ''">

            <div class="me-3">
                <div class="d-flex align-items-center gap-2">
                    <span th:if="${!notification.isRead}" class="badge bg-primary rounded-pill">New</span>
                    <h6 class="mb-1" th:text="${notification.title}">Title</h6>
                </div>
                <p class="mb-1 text-secondary" th:text="${notification.message}">Message text</p>
                <small class="text-muted" th:text="${#temporals.format(notification.createdAt, 'dd.MM.yyyy HH:mm')}">Date</small>
            </div>

            <a th:if="${notification.link != null}"
               th:href="${notification.link}"
               class="btn btn-sm btn-outline-primary text-nowrap">
                View <i class="bi bi-arrow-right"></i>
            </a>
        </div>
    </div>

    <!-- Empty State -->
    <div class="alert alert-info text-center" th:unless="${notificationPage.hasContent()}">
        You have no notifications yet.
    </div>

    <!-- Pagination -->
    <nav th:if="${totalPages > 1}">
        <ul class="pagination justify-content-center">

            <!-- Previous Button -->
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/profile/notifications(page=${currentPage - 1})}">Previous</a>
            </li>

            <!-- Page Numbers -->
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link"
                   th:href="@{/profile/notifications(page=${i})}"
                   th:text="${i + 1}">1</a>
            </li>

            <!-- Next Button -->
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/profile/notifications(page=${currentPage + 1})}">Next</a>
            </li>

        </ul>
    </nav>
</div>

</body>
</html>
