<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Управление диетами | NutriBite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<header class="custom-navbar">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-3 col-lg-2">
                <a href="/">
                    <img th:src="@{/icons/Logo.svg}" alt="logo">
                </a>
            </div>
            <div class="col text-end">
                <a th:href="@{/admin}" class="btn btn-tb-outline btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Назад
                </a>
            </div>
        </div>
    </div>
</header>

<main class="flex-grow-1 py-5">
    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-5">
            <div>
                <h1 class="display-6 fw-bold text-dark m-0">Диеты</h1>
                <p class="text-muted mb-0">Управление каталогом систем питания</p>
            </div>
            <a th:href="@{/admin/diets/add}" class="btn btn-tb-orange">
                <i class="bi bi-plus-lg me-1"></i> Добавить диету
            </a>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4 mb-5" th:unless="${#lists.isEmpty(diets.content)}">
            <div class="col" th:each="diet : ${diets.content}">
                <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden d-flex flex-column">
                    <div class="position-relative" style="height: 180px;">
                        <img th:src="@{{path}(path=${diet.imagePath != null ? diet.imagePath : '/images/default-diet.jpg'})}"
                             th:alt="${diet.name}"
                             class="w-100 h-100 object-fit-cover">
                    </div>

                    <div class="card-body d-flex flex-column p-4">
                        <h2 class="h5 card-title fw-bold text-dark mb-2" th:text="${diet.name}">Кето-диета</h2>
                        <p class="card-text text-muted small flex-grow-1 lh-sm"
                           th:text="${diet.shortDescription != null ? #strings.abbreviate(diet.shortDescription, 100) : ''}">
                            Краткое описание диеты...
                        </p>

                        <div class="d-flex gap-2 mt-auto pt-2 border-top">
                            <a th:href="@{/admin/diets/edit(dietId=${diet.id})}" class="btn btn-outline-secondary btn-sm flex-grow-1 fw-semibold">
                                <i class="bi bi-pencil me-1"></i> Изменить
                            </a>
                            <form th:action="@{/admin/diets/delete(dietId=${diet.id})}" method="post" class="d-inline delete-diet-form">
                                <button type="submit" class="btn btn-outline-danger btn-sm" title="Удалить">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center py-5 bg-white rounded-4 border shadow-sm" th:if="${#lists.isEmpty(diets.content)}">
            <i class="bi bi-journal-x fs-1 text-muted d-block mb-2"></i>
            <h3 class="h6 fw-semibold text-dark">Диеты не найдены</h3>
            <p class="text-muted small mb-0">В каталоге пока нет добавленных диет.</p>
        </div>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteConfirmModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-body text-center p-3">
                <h5 class="fw-bold text-dark mb-2" id="deleteConfirmModalLabel">Удалить диету?</h5>
                <p class="text-muted small mb-4">
                    Вы действительно хотите удалить эту диету?<br>
                    Это действие нельзя будет отменить.
                </p>

                <div class="d-flex justify-content-center gap-2">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" id="confirmDeleteBtn" class="btn btn-danger rounded-pill px-4">
                        <i class="bi bi-trash me-1"></i> Удалить
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const deleteModalEl = document.getElementById('deleteConfirmModal');
        if (!deleteModalEl) return;

        const deleteModal = new bootstrap.Modal(deleteModalEl);
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');

        let activeForm = null;
        let activeCardCol = null;

        const csrfToken = document.querySelector("meta[name='_csrf']")?.getAttribute("content");
        const csrfHeader = document.querySelector("meta[name='_csrf_header']")?.getAttribute("content");

        const headers = {
            'Content-Type': 'application/x-www-form-urlencoded'
        };
        if (csrfToken && csrfHeader) {
            headers[csrfHeader] = csrfToken;
        }

        document.querySelectorAll('.delete-diet-form').forEach(form => {
            form.addEventListener('submit', (event) => {
                event.preventDefault();

                activeForm = form;
                activeCardCol = form.closest('.col');

                deleteModal.show();
            });
        });

        confirmDeleteBtn.addEventListener('click', async () => {
            if (!activeForm) return;

            confirmDeleteBtn.disabled = true;
            confirmDeleteBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Удаление...';

            try {
                const response = await fetch(activeForm.action, {
                    method: 'POST',
                    headers: headers
                });

                if (response.ok) {
                    deleteModal.hide();

                    if (activeCardCol) {
                        activeCardCol.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                        activeCardCol.style.opacity = '0';
                        activeCardCol.style.transform = 'scale(0.9)';

                        setTimeout(() => {
                            activeCardCol.remove();

                            const remainingCards = document.querySelectorAll('.delete-diet-form');
                            if (remainingCards.length === 0) {
                                location.reload();
                            }
                        }, 300);
                    }

                    if (typeof showToast === 'function') {
                        showToast('Диета успешно удалена!', true);
                    }
                } else {
                    const errorText = await response.text();
                    alert(errorText || 'Ошибка при удалении диеты');
                }
            } catch (error) {
                console.error('Fetch error:', error);
                alert('Ошибка сети при отправке запроса');
            } finally {
                confirmDeleteBtn.disabled = false;
                confirmDeleteBtn.innerHTML = '<i class="bi bi-trash me-1"></i> Удалить';
                activeForm = null;
                activeCardCol = null;
            }
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
