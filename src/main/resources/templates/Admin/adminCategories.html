<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories | Tastebite Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .carousel-indicators [data-bs-target] {
            background-color: var(--tb-orange);
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .category-admin-card {
            background: #ffffff;
            border: 1px solid #E8E8E8;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .category-admin-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.05);
        }

        .category-admin-thumb {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

<header class="custom-navbar">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-3 col-lg-2">
                <a href="/">
                    <img th:src="@{/icons/Logo.svg}" alt="logo">
                </a>
            </div>
            <div class="col text-end">
                <a th:href="@{/admin}" class="btn btn-tb-outline btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Dashboard
                </a>
            </div>
        </div>
    </div>
</header>

<main class="admin-section flex-grow-1 py-5">
    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
            <div>
                <h1 class="font-serif fw-bold m-0" style="font-size: 32px;">Категории</h1>
                <p class="text-muted small m-0 mt-1">
                    Всего категорий: <span class="fw-bold" th:text="${totalCategories}">0</span>
                </p>
            </div>

            <button type="button" class="btn btn-tb-orange" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
                <i class="bi bi-plus-lg me-1"></i> Добавить категорию
            </button>
        </div>

        <div th:if="${#lists.isEmpty(categoryPages)}" class="text-center py-5">
            <i class="bi bi-grid-3x3-gap fs-1 text-muted"></i>
            <p class="text-muted fs-5 mt-2">Категории не найдены. Нажмите "Добавить категорию", чтобы создать первую.</p>
        </div>

        <div th:unless="${#lists.isEmpty(categoryPages)}" class="my-4">
            <div id="categoriesCarousel" class="carousel slide" data-bs-ride="false" data-bs-interval="false">

                <div class="carousel-inner pb-3">
                    <div th:each="page, pageStat : ${categoryPages}"
                         class="carousel-item"
                         th:classappend="${pageStat.first} ? 'active'">

                        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-3">
                            <div class="col" th:each="category : ${page}">
                                <div class="category-admin-card">
                                    <div class="d-flex align-items-center gap-3 text-truncate">
                                        <img th:src="${category.imagePath}"
                                             th:alt="${category.name}"
                                             class="category-admin-thumb"
                                             onerror="this.src='/images/placeholder.jpg';">
                                        <span class="fw-semibold text-dark text-truncate" th:text="${category.name}">Название категории</span>
                                    </div>

                                    <!-- Кнопка удаления категории -->
                                    <button type="button"
                                            class="btn btn-outline-danger btn-sm rounded-circle p-0 d-flex align-items-center justify-content-center flex-shrink-0"
                                            style="width: 32px; height: 32px;"
                                            data-bs-toggle="modal"
                                            th:data-bs-target="'#deleteModal-' + ${category.id}"
                                            title="Удалить категорию">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>

                                <!-- Модальное окно подтверждения удаления -->
                                <div class="modal fade" th:id="'deleteModal-' + ${category.id}" tabindex="-1" aria-hidden="true">
                                    <div class="modal-dialog modal-dialog-centered">
                                        <div class="modal-content">
                                            <div class="modal-header border-0">
                                                <h5 class="modal-title font-serif fw-bold">Подтверждение удаления</h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                                            </div>
                                            <div class="modal-body">
                                                Вы уверены, что хотите удалить категорию <strong th:text="${category.name}">Категория</strong>?
                                                <p class="text-danger small mt-2 m-0">Это действие нельзя будет отменить.</p>
                                            </div>
                                            <div class="modal-footer border-0">
                                                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Отмена</button>
                                                <form th:action="@{/admin/categories/delete(categoryId=${category.id})}" method="post">
                                                    <button type="submit" class="btn btn-danger">Удалить</button>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>

                    </div>
                </div>

                <th:block th:if="${#lists.size(categoryPages) > 1}">
                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <button class="btn btn-tb-outline btn-sm rounded-circle" type="button" data-bs-target="#categoriesCarousel" data-bs-slide="prev" style="width: 38px; height: 38px; padding: 8px 8px !important;">
                            <i class="bi bi-chevron-left"></i>
                        </button>
                        <button class="btn btn-tb-outline btn-sm rounded-circle" type="button" data-bs-target="#categoriesCarousel" data-bs-slide="next" style="width: 38px; height: 38px; padding: 8px 8px !important;">
                            <i class="bi bi-chevron-right"></i>
                        </button>
                    </div>
                </th:block>

            </div>
        </div>

    </div>
</main>

<div class="modal fade" id="addCategoryModal" tabindex="-1" aria-labelledby="addCategoryModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="modal-title font-serif fw-bold" id="addCategoryModalLabel">Add New Category</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/admin/categories/add}" method="post" enctype="multipart/form-data">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="categoryName" class="form-label fw-bold">Category Name</label>
                        <input type="text"
                               class="form-control form-control-tb"
                               id="categoryName"
                               name="name"
                               required>
                    </div>
                    <div class="mb-3">
                        <label for="image" class="form-label fw-bold">Image</label>
                        <input type="file"
                               class="form-control form-control-tb"
                               id="image"
                               name="file"
                               accept="image/png, image/jpeg"
                               required>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-tb-orange">Create Category</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" th:if="${message != null}">
    <div id="successToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="alert alert-success m-0 flex-nowrap justify-content-between">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" th:if="${error}">
    <div id="ErrorToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="alert alert-danger m-0 flex-nowrap justify-content-between">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
