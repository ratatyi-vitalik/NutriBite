<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favourites - Tastebite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="custom-navbar">
    <div class="container">
        <div class="row align-items-center">

            <div class="col-3 col-lg-2">
                <a href="/">
                    <img th:src="@{/icons/Logo.svg}" alt="logo">
                </a>
            </div>

            <div class="col-6 col-lg-8 d-none d-md-block">
                <ul class="nav justify-content-center navbar-nav flex-row">
                    <li class="nav-item">
                        <a class="nav-link" href="/profile/favourites">
                            Favourites
                        </a>
                    </li>
                </ul>
            </div>

            <div class="col-3 col-lg-2 d-flex align-items-center justify-content-end gap-4">
                <div class="search-integration-wrapper" id="searchWrapper">

                    <!-- Кнопка-лупа, которая изначально видна в шапке -->
                    <button class="search-btn main-trigger-icon" id="searchTriggerBtn" type="button"
                            aria-label="Search">
                        <i class="bi bi-search"></i>
                    </button>

                    <!-- Внутреннее содержимое панели (поля ввода и кнопка закрытия) -->
                    <div class="search-expandable-content">
                        <input type="text" id="searchLiveInput" class="search-minimal-input" placeholder="Cake"
                               autocomplete="off">
                        <button class="search-action-icon" id="searchCloseBtn" type="button" aria-label="Close">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>

                    <!-- Контейнер для динамического списка результатов -->
                    <div class="search-attached-results" id="searchLiveResults"></div>
                </div>

                <a href="/profile" class="profile-block" th:unless="${user == null}">
                    <img th:src="${user.avatarPath != null ? user.avatarPath : '/icons/avatar.png'}"
                         alt="profile" class="rounded-circle" style="width: 32px; height: 32px; object-fit: cover;">
                </a>

            </div>

        </div>
    </div>
</header>

<div class="container category-recipes-section">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="searchResultsGrid">
        <div class="col" th:each="recipe : ${recipes}">
            <a th:href="@{/recipe(recipeId=${recipe.id})}" class="recipe-card-link text-decoration-none">
                <div class="recipe-card-img-wrapper">
                    <img th:src="${recipe.imagePath}"
                         class="recipe-card-img"
                         th:alt="${recipe.title}">
                </div>
                <h3 class="recipe-card-title mt-2" th:text="${recipe.title}"></h3>
            </a>
        </div>
    </div>
</div>

<script th:replace="~{fragments/header :: searchScript}"></script>
</body>
</html>
