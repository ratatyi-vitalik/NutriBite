<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Recipes - Tastebite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Шапка сайта -->
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="category-recipes-section py-5">
    <div class="container">

        <h1 class="page-title-categories mb-4">All Recipes</h1>

        <!-- Форма фильтрации и сортировки -->
        <form id="filterForm" class="row g-3 align-items-center mb-5 p-3 rounded shadow-sm bg-light">
            <!-- Поиск по имени -->
            <div class="col-12 col-md-4">
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                    <input type="text" name="query" class="form-control" placeholder="Search recipes..." th:value="${query}">
                </div>
            </div>

            <!-- Фильтр по категории -->
            <div class="col-12 col-sm-6 col-md-3">
                <select name="categoryId" class="form-select">
                    <option value="0">All Categories</option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat.id}"
                            th:text="${cat.name}"
                            th:selected="${cat.id == selectedCategory}">Category</option>
                </select>
            </div>

            <!-- Сортировка -->
            <div class="col-12 col-sm-6 col-md-3">
                <select name="sortBy" class="form-select">
                    <option value="newest" th:selected="${sortBy == 'newest'}">Сначала новые</option>
                    <option value="oldest" th:selected="${sortBy == 'oldest'}">Сначала старые</option>
                    <option value="rating" th:selected="${sortBy == 'rating'}">Популярные</option>
                    <option value="popularity" th:selected="${sortBy == 'popularity'}">Лучшие оценки</option>
                </select>
            </div>

            <!-- Сброс фильтров -->
            <div class="col-12 col-md-2 d-flex">
                <button type="button" id="resetBtn" class="btn btn-outline-secondary w-100">Сбросить</button>
            </div>
        </form>

        <div>

            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" th:if="${recipesPage != null and !recipesPage.empty}">
                <div class="col" th:each="recipe : ${recipesPage.content}">
                    <a th:href="@{/recipe?recipeId={id}(id=${recipe.id})}" class="recipe-card-link">
                        <div class="recipe-card-img-wrapper position-relative">
                            <img th:src="@{{path}(path=${recipe.imagePath != null ? recipe.imagePath : '/images/default-recipe.jpg'})}"
                                 th:alt="${recipe.title}"
                                 class="recipe-card-img">

                            <div class="recipe-rating-badge position-absolute top-0 end-0 m-3 shadow-sm" th:if="${recipe.averageRating > 0}">
                                <i class="bi bi-star-fill text-warning fs-6"></i>
                                <span th:text="${#numbers.formatDecimal(recipe.averageRating, 1, 1)}">4.5</span>
                            </div>
                        </div>

                        <div class="mt-3">
                            <h3 class="recipe-card-title text-truncate d-block"
                                th:text="${recipe.title}"
                                th:title="${recipe.title}">Recipe Title</h3>

                            <div class="d-flex align-items-center justify-content-between gap-2 mt-2 text-muted fs-6">
                        <span th:if="${recipe.prepTime != null or recipe.cookTime != null}">
                            <i class="bi bi-clock me-1"></i>
                            <span th:text="${recipe.formattedCookTimePlusPrepTime}">30 mins</span>
                        </span>

                                <span class="badge bg-light text-dark fw-normal" th:if="${recipe.category != null}" th:text="${recipe.category.name}">Category</span>
                            </div>
                        </div>
                    </a>
                </div>
            </div>

            <div class="text-center py-5" th:if="${recipesPage == null or recipesPage.empty}">
                <p class="text-muted fs-5">No recipes found according to selected filters.</p>
            </div>

            <div class="d-flex justify-content-center mt-5" th:if="${recipesPage != null and recipesPage.totalPages > 1}">
                <nav aria-label="Page navigation">
                    <ul class="pagination">
                        <!-- Назад -->
                        <li class="page-item" th:classappend="${recipesPage.first} ? 'disabled'">
                            <a class="page-link page-link-ajax text-dark" href="#" th:data-page="${recipesPage.number - 1}">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>

                        <!-- Страницы -->
                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, recipesPage.totalPages - 1)}"
                            th:classappend="${i == recipesPage.number} ? 'active'">
                            <a class="page-link page-link-ajax"
                               href="#"
                               th:data-page="${i}"
                               th:text="${i + 1}">1</a>
                        </li>

                        <!-- Вперед -->
                        <li class="page-item" th:classappend="${recipesPage.last} ? 'disabled'">
                            <a class="page-link page-link-ajax text-dark" href="#" th:data-page="${recipesPage.number + 1}">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>

        </div>

    </div>
</main>

<!-- Подключение футера -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Модальные окна -->
<div th:replace="~{fragments/header :: modalSignUp}"></div>
<div th:replace="~{fragments/header :: modalRegister}"></div>
<div th:replace="~{fragments/header :: modalForgot}"></div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const filterForm = document.getElementById('filterForm');
        const recipesContainer = document.getElementById('recipesContainer');
        const resetBtn = document.getElementById('resetBtn');

        let debounceTimer;

        // Вспомогательная функция форматирования общего времени
        function formatTotalTime(prepTime, cookTime) {
            const total = (prepTime || 0) + (cookTime || 0);
            if (total <= 0) return null;

            const hours = Math.floor(total / 60);
            const mins = total % 60;

            if (hours > 0) {
                return mins > 0 ? `${hours} hours ${mins} mins` : `${hours} hours`;
            }
            return `${mins} mins`;
        }

        async function fetchRecipes(page = 0) {
            const formData = new FormData(filterForm);
            const params = new URLSearchParams();

            const query = formData.get('query') ? formData.get('query').trim() : '';
            const categoryId = formData.get('categoryId') || '0';
            const sortBy = formData.get('sortBy') || 'newest';

            if (query) params.set('query', query);
            if (categoryId !== '0') params.set('categoryId', categoryId);
            if (sortBy) params.set('sortBy', sortBy);
            params.set('page', page);

            try {
                const response = await fetch(`/recipes/filters?${params.toString()}`, {
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    const data = await response.json();

                    recipesContainer.innerHTML = '';
                    renderRecipes(data.content);
                    renderPagination(data);

                    const browserUrl = params.toString() ? `/recipes?${params.toString()}` : '/recipes';
                    window.history.pushState({}, '', browserUrl);
                } else {
                    console.error('Server error:', response.status);
                }
            } catch (error) {
                console.error('Error fetching recipes:', error);
            }
        }

        // Рендеринг карточек в точности по структуре Thymeleaf
        function renderRecipes(recipes) {
            if (!recipes || recipes.length === 0) {
                recipesContainer.innerHTML = `
                    <div class="text-center py-5">
                        <p class="text-muted fs-5">No recipes found according to selected filters.</p>
                    </div>`;
                return;
            }

            const cardsHtml = recipes.map(recipe => {
                const imgPath = recipe.imagePath || '/images/default-recipe.jpg';
                const rating = recipe.averageRating || recipe.rating || 0;
                const formattedRating = rating > 0 ? Number(rating).toFixed(1) : null;
                const totalTimeText = formatTotalTime(recipe.prepTime, recipe.cookTime);
                const categoryName = recipe.category ? recipe.category.name : (recipe.categoryName || null);

                return `
                <div class="col">
                    <a href="/recipe?recipeId=${recipe.id}" class="recipe-card-link">
                        <div class="recipe-card-img-wrapper position-relative">
                            <img src="${imgPath}" alt="${recipe.title || ''}" class="recipe-card-img">

                            ${formattedRating ? `
                                <div class="recipe-rating-badge position-absolute top-0 end-0 m-3 shadow-sm">
                                    <i class="bi bi-star-fill text-warning fs-6"></i>
                                    <span>${formattedRating}</span>
                                </div>
                            ` : ''}
                        </div>

                        <div class="mt-3">
                            <h3 class="recipe-card-title text-truncate d-block" title="${recipe.title || ''}">${recipe.title || ''}</h3>

                            <div class="d-flex align-items-center justify-content-between gap-2 mt-2 text-muted fs-6">
                                ${totalTimeText ? `
                                    <span>
                                        <i class="bi bi-clock me-1"></i>
                                        <span>${totalTimeText}</span>
                                    </span>
                                ` : '<span></span>'}

                                ${categoryName ? `
                                    <span class="badge bg-light text-dark fw-normal">${categoryName}</span>
                                ` : ''}
                            </div>
                        </div>
                    </a>
                </div>`;
            }).join('');

            recipesContainer.innerHTML = `<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">${cardsHtml}</div>`;
        }

        // Рендеринг пагинации в точности как в Thymeleaf
        function renderPagination(pageData) {
            if (!pageData || pageData.totalPages <= 1) return;

            let paginationHtml = `
                <div class="d-flex justify-content-center mt-5">
                    <nav aria-label="Page navigation">
                        <ul class="pagination">`;

            // Кнопка Назад
            const prevDisabled = pageData.first ? 'disabled' : '';
            paginationHtml += `
                <li class="page-item ${prevDisabled}">
                    <a class="page-link page-link-ajax text-dark" href="#" data-page="${pageData.number - 1}">
                        <span aria-hidden="true">&laquo;</span>
                    </a>
                </li>`;

            // Страницы
            for (let i = 0; i < pageData.totalPages; i++) {
                const active = i === pageData.number ? 'active' : '';
                paginationHtml += `
                    <li class="page-item ${active}">
                        <a class="page-link page-link-ajax" href="#" data-page="${i}">${i + 1}</a>
                    </li>`;
            }

            // Кнопка Вперед
            const nextDisabled = pageData.last ? 'disabled' : '';
            paginationHtml += `
                <li class="page-item ${nextDisabled}">
                    <a class="page-link page-link-ajax text-dark" href="#" data-page="${pageData.number + 1}">
                        <span aria-hidden="true">&raquo;</span>
                    </a>
                </li>
            `;

            paginationHtml += `
                        </ul>
                    </nav>
                </div>`;

            recipesContainer.insertAdjacentHTML('beforeend', paginationHtml);
        }

        filterForm.addEventListener('submit', (e) => {
            e.preventDefault();
            clearTimeout(debounceTimer);
            fetchRecipes(0);
        });

        filterForm.addEventListener('change', (e) => {
            if (e.target.tagName === 'SELECT') {
                fetchRecipes(0);
            }
        });

        filterForm.addEventListener('input', (e) => {
            if (e.target.name === 'query') {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => fetchRecipes(0), 400);
            }
        });

        resetBtn.addEventListener('click', () => {
            filterForm.querySelector('input[name="query"]').value = '';
            const categorySelect = filterForm.querySelector('select[name="categoryId"]');
            if (categorySelect) categorySelect.selectedIndex = 0;
            filterForm.querySelector('select[name="sortBy"]').value = 'newest';
            fetchRecipes(0);
        });

        recipesContainer.addEventListener('click', (e) => {
            const pageLink = e.target.closest('.page-link-ajax');
            if (pageLink && !pageLink.parentElement.classList.contains('disabled')) {
                e.preventDefault();
                const page = pageLink.dataset.page;
                fetchRecipes(page);
            }
        });
    });
</script>

<script th:replace="~{fragments/header :: searchScript}"></script>
<script th:replace="~{fragments/header :: openLoginScript}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
