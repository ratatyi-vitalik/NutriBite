<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Recipes - Tastebite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Шапка сайта -->
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="category-recipes-section py-5">
    <div class="container">

        <h1 class="page-title-categories mb-4">All Recipes</h1>

        <!-- Форма фильтрации и сортировки -->
        <form id="filterForm" class="row g-3 align-items-center mb-5 p-3 rounded shadow-sm bg-light">
            <!-- Поиск по имени -->
            <div class="col-12 col-md-4">
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                    <input type="text" name="query" class="form-control" placeholder="Search recipes..." th:value="${query}">
                </div>
            </div>

            <!-- Фильтр по категории -->
            <div class="col-12 col-sm-6 col-md-3">
                <select name="categoryId" class="form-select">
                    <option value="">All Categories</option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat.id}"
                            th:text="${cat.name}"
                            th:selected="${cat.id == selectedCategory}">Category</option>
                </select>
            </div>

            <!-- Сортировка -->
            <div class="col-12 col-sm-6 col-md-3">
                <select name="sortBy" class="form-select">
                    <option value="newest" th:selected="${sortBy == 'newest'}">Newest First</option>
                    <option value="rating" th:selected="${sortBy == 'rating'}">Highest Rated</option>
                    <option value="prepTime" th:selected="${sortBy == 'prepTime'}">Fastest Prep Time</option>
                </select>
            </div>

            <!-- Сброс фильтров -->
            <div class="col-12 col-md-2 d-flex">
                <button type="button" id="resetBtn" class="btn btn-outline-secondary w-100">Reset</button>
            </div>
        </form>

        <!-- Контейнер для списка рецептов и пагинации (обновляется через AJAX) -->
        <div id="recipesContainer">
            <div th:replace="~{fragments/recipes-list :: list}"></div>
        </div>

    </div>
</main>

<!-- Подключение футера -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Модальные окна -->
<div th:replace="~{fragments/header :: modalSignUp}"></div>
<div th:replace="~{fragments/header :: modalRegister}"></div>
<div th:replace="~{fragments/header :: modalForgot}"></div>

<!-- AJAX скрипт фильтрации -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const filterForm = document.getElementById('filterForm');
        const recipesContainer = document.getElementById('recipesContainer');
        const resetBtn = document.getElementById('resetBtn');

        let debounceTimer;

        // Главная функция отправки AJAX запроса
        async function fetchRecipes(page = 0) {
            const formData = new FormData(filterForm);
            const params = new URLSearchParams(formData);

            // Добавляем номер страницы
            params.set('page', page);

            try {
                // Добавляем заголовок X-Requested-With для определения AJAX запроса на сервере
                const response = await fetch(`/recipes/filter?${params.toString()}`, {
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });

                if (response.ok) {
                    const html = await response.text();
                    recipesContainer.innerHTML = html;

                    // Обновляем URL в браузере без перезагрузки
                    window.history.pushState({}, '', `/recipes?${params.toString()}`);
                }
            } catch (error) {
                console.error('Error fetching recipes:', error);
            }
        }

        // Событие изменения полей формы (селекты и ввод текста)
        filterForm.addEventListener('change', (e) => {
            if (e.target.tagName === 'SELECT') {
                fetchRecipes(0);
            }
        });

        filterForm.addEventListener('input', (e) => {
            if (e.target.name === 'query') {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => fetchRecipes(0), 400); // Debounce 400ms
            }
        });

        // Кнопка сброса
        resetBtn.addEventListener('click', () => {
            filterForm.reset();
            fetchRecipes(0);
        });

        // Делегирование событий для кликов по пагинации
        recipesContainer.addEventListener('click', (e) => {
            const pageLink = e.target.closest('.page-link-ajax');
            if (pageLink) {
                e.preventDefault();
                const page = pageLink.dataset.page;
                fetchRecipes(page);
            }
        });
    });
</script>

<script th:replace="~{fragments/header :: searchScript}"></script>
<script th:replace="~{fragments/header :: openLoginScript}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
