<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title th:text="${recipe.title}"></title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="recipe-section">
    <div class="container">

        <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
            <div>
                <h1 class="recipe-title" th:text="${recipe.title}"></h1>

                <div class="recipe-meta flex-wrap">
                    <span><i class="bi bi-person me-1"></i> <span
                            th:text="${!#strings.isEmpty(recipe.author?.fullName)} ? ${recipe.author.fullName} : ${recipe.author?.name}"></span></span>
                    <span><i class="bi bi-calendar3 me-1"></i> <span th:text="${recipe.date}"></span></span>
                    <span><i class="bi bi-chat-left me-1"></i> <span th:text="${#lists.size(recipe.comments)}"></span></span>
                    <div class="d-inline-flex align-items-center gap-1" th:with="ratingPercent=${(recipe.averageRating / 5.0) * 100}">
                        <div class="stars-outer fs-5">
                            <div class="stars-inner" th:style="'width: ' + ${ratingPercent} + '%'"></div>
                        </div>
                        <span class="text-muted small ms-1" th:text="${#numbers.formatDecimal(recipe.averageRating, 1, 1)}">4.5</span>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-3 fs-5 pt-2">
                <button id="fav-btn"
                        class="btn p-0"
                        aria-label="Bookmark"
                        th:data-recipe-id="${recipe.id}">
                    <i class="bi"
                       th:classappend="${user != null && recipe.saved.contains(user)} ? 'bi-bookmark-fill text-warning' : 'bi-bookmark'">
                    </i>
                </button>
            </div>
        </div>

        <p class="recipe-description" th:text="${recipe.description}"></p>

        <div th:if="${recipe.videoPath != null and !#strings.isEmpty(recipe.videoPath)}" class="ratio ratio-16x9 mb-4">
            <video controls
                   class="w-100 rounded"
                   th:src="@{${recipe.videoPath}}"
                   th:poster="@{${recipe.imagePath}}">
            </video>
        </div>

        <div th:unless="${recipe.videoPath != null and !#strings.isEmpty(recipe.videoPath)}" class="mb-4">
            <img th:src="@{${recipe.imagePath}}"
                 alt="Recipe Image"
                 class="img-fluid rounded w-100 object-fit-cover">
        </div>

        <div class="d-flex align-items-center mb-5 border-bottom pb-4">
            <div class="recipe-time-card">
                <div class="recipe-time-label">Prep Time</div>
                <div class="recipe-time-value" th:text="${recipe.prepTime}"></div>
            </div>
            <div class="recipe-time-card">
                <div class="recipe-time-label">Cook Time</div>
                <div class="recipe-time-value" th:text="${recipe.cookTime}"></div>
            </div>
            <div class="recipe-time-card">
                <div class="recipe-time-label">Servings</div>
                <div class="recipe-time-value" th:text="${recipe.servings}"></div>
            </div>
        </div>

        <div class="row g-5 mb-5">
            <div class="col-lg-7">
                <h2 class="recipe-subtitle">Ingredients</h2>

                <div th:each="section : ${recipe.ingredientSections}">
                    <h3 class="ingredient-section-title" th:text="${section.title}">For the crust</h3>

                    <div class="ingredient-item" th:each="ingredient : ${section.ingredients}">
                        <div class="ingredient-checkbox"></div>
                        <span th:text="${ingredient.amount + ' ' + ingredient.name}"></span>
                    </div>
                </div>
            </div>

            <!-- Блок Nutrition Facts (справа, занимает 5/12 ширины) -->
            <div class="col-lg-5">
                <div class="nutrition-card">
                    <h2 class="nutrition-title">Nutrition Facts</h2>

                    <div class="nutrition-row">
                        <span class="nutrition-label">Calories</span>
                        <span class="nutrition-value" th:text="${recipe.nutrition.calories}"></span>
                    </div>
                    <div class="nutrition-row">
                        <span class="nutrition-label">Carbs</span>
                        <span class="nutrition-value" th:text="${recipe.nutrition.carbs}"></span>
                    </div>
                    <div class="nutrition-row">
                        <span class="nutrition-label">Fat</span>
                        <span class="nutrition-value" th:text="${recipe.nutrition.fat}"></span>
                    </div>
                    <div class="nutrition-row">
                        <span class="nutrition-label">Protein</span>
                        <span class="nutrition-value" th:text="${recipe.nutrition.protein}"></span>
                    </div>
                </div>
            </div>
        </div>

        <hr class="my-5" style="color: #E8E8E8;">

        <div class="row">
            <div class="col-12">
                <h2 class="recipe-subtitle">Instructions</h2>

                <div class="instructions-list">
                    <div class="instruction-step" th:each="step, iterStat : ${recipe.instructions}">
                        <div class="step-number" th:text="${iterStat.count}">1</div>
                        <p class="step-text" th:text="${step.text}"></p>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <section class="comments-section">
        <div class="container">

            <h2 class="comments-header">
                Comments <span class="comments-count" th:text="'(' + ${#lists.size(recipe.comments)} + ')'">(0)</span>
            </h2>

            <div class="comments-list">

                <div class="comment-container" th:each="comment : ${recipe.comments}">
                    <div class="d-flex gap-3">
                        <img th:src="${comment.author.avatarPath != null ? comment.author.avatarPath : '/icons/avatar.png'}"
                             alt="Avatar" class="comment-avatar">

                        <div class="flex-grow-1">
                            <div class="d-flex flex-column">
                                <h4 class="comment-author-name"
                                    th:text="${comment.author.fullName != null ? comment.author.fullName : comment.author.name}">
                                    Jelanee Sen</h4>
                                <span class="comment-date"
                                      th:text="${#temporals.format(comment.date, 'dd.MM.yyyy HH:mm')}"></span>
                            </div>

                            <p class="comment-text" th:text="${comment.text}"></p>

                            <div class="comment-actions">
                                <button class="comment-action-btn" type="button"
                                        data-bs-toggle="modal" data-bs-target="#loginModal"
                                        th:if="${user == null}">
                                    <i class="bi bi-chat-left"></i>
                                    Reply <span th:text="'(' + ${#lists.size(comment.replies)} + ')'"></span>
                                </button>
                                <button class="comment-action-btn js-reply-btn" type="button"
                                        th:data-comment-id="${comment.id}"
                                        th:data-author-name="${comment.author.fullName != null ? comment.author.fullName : comment.author.name}"
                                        th:data-comment-text="${comment.text}"
                                        th:unless="${user == null}">
                                    <i class="bi bi-chat-left"></i>
                                    Reply <span th:text="'(' + ${#lists.size(comment.replies)} + ')'"></span>
                                </button>

                                <button class="comment-action-btn" type="button"
                                        data-bs-toggle="modal" data-bs-target="#loginModal"
                                        th:if="${user == null}">
                                    <i class="bi bi-heart"></i>
                                    <span class="likes-count" th:text="${comment.getLikes().size()}">0</span>
                                </button>
                                <button class="comment-action-btn js-like-btn" type="button"
                                        th:data-comment-id="${comment.id}"
                                        th:classappend="${user != null && comment.likes.contains(user)} ? 'text-danger' : ''"
                                        th:unless="${user == null}">

                                    <i class="bi" th:classappend="${user != null && comment.likes.contains(user)} ? 'bi-heart-fill' : 'bi-heart'"></i>

                                    <span class="likes-count" th:text="${comment.getLikes().size()}">0</span>
                                </button>

                                <button class="comment-action-btn" type="button"
                                        data-bs-toggle="modal" data-bs-target="#loginModal"
                                        th:if="${user == null}">
                                    <i class="bi bi-flag"></i>
                                </button>

                                <button class="comment-action-btn js-report-btn" type="button"
                                        th:data-comment-id="${comment.id}"
                                        th:unless="${user == null}"
                                        title="Report">
                                    <i class="bi bi-flag"></i>
                                </button>

                                <form th:if="${user != null and user.role == 'ADMIN'}"
                                      th:action="@{/admin/delete-comment}"
                                      method="post"
                                      class="d-inline"
                                      onsubmit="return confirm('Вы уверены, что хотите удалить этот комментарий?');">
                                    <input type="hidden" name="commentId" th:value="${comment.id}">
                                    <input type="hidden" name="recipeId" th:value="${recipe.id}">
                                    <button type="submit" class="comment-action-btn text-danger">
                                        <i class="bi bi-trash"></i> Delete
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div class="replies-wrapper" th:if="${not #lists.isEmpty(comment.replies)}">

                        <div class="reply-container" th:each="reply : ${comment.replies}">
                            <div class="d-flex gap-3">
                                <img th:src="${reply.author.avatarPath != null ? reply.author.avatarPath : '/icons/avatar.png'}"
                                     alt="Avatar" class="reply-avatar">

                                <div class="flex-grow-1">
                                    <div class="d-flex flex-column">
                                        <h4 class="comment-author-name"
                                            th:text="${reply.author.fullName != null ? reply.author.fullName : reply.author.name}">
                                            Qiu Xun</h4>
                                        <span class="comment-date"
                                              th:text="${#temporals.format(reply.date, 'dd.MM.yyyy HH:mm')}"></span>
                                    </div>

                                    <p class="comment-text" th:text="${reply.text}"></p>

                                    <div class="comment-actions">
                                        <button class="comment-action-btn" type="button"
                                                data-bs-toggle="modal" data-bs-target="#loginModal"
                                                th:if="${user == null}">
                                            <i class="bi bi-chat-left"></i>
                                            Reply <span th:text="'(' + ${#lists.size(comment.replies)} + ')'"></span>
                                        </button>
                                        <button class="comment-action-btn js-reply-btn" type="button"
                                                th:data-comment-id="${comment.id}"
                                                th:data-author-name="${reply.author.fullName != null ? reply.author.fullName : reply.author.name}"
                                                th:data-comment-text="${reply.text}"
                                                th:unless="${user == null}">
                                            <i class="bi bi-chat-left"></i>
                                            Reply <span th:text="'(' + ${#lists.size(comment.replies)} + ')'"></span>
                                        </button>

                                        <button class="comment-action-btn" type="button"
                                                data-bs-toggle="modal" data-bs-target="#loginModal"
                                                th:if="${user == null}">
                                            <i class="bi bi-heart"></i>
                                            <span class="likes-count" th:text="${comment.getLikes().size()}">0</span>
                                        </button>
                                        <button class="comment-action-btn js-like-btn" type="button"
                                                th:data-comment-id="${comment.id}"
                                                th:classappend="${user != null && comment.likes.contains(user)} ? 'text-danger' : ''"
                                                th:unless="${user == null}">

                                            <i class="bi" th:classappend="${user != null && comment.likes.contains(user)} ? 'bi-heart-fill' : 'bi-heart'"></i>
                                            <span class="likes-count" th:text="${comment.getLikes().size()}">0</span>
                                        </button>

                                        <button class="comment-action-btn" type="button"
                                                data-bs-toggle="modal" data-bs-target="#loginModal"
                                                th:if="${user == null}">
                                            <i class="bi bi-flag"></i>
                                        </button>

                                        <!-- Кнопка репорта ответов для авторизованных пользователей -->
                                        <button class="comment-action-btn js-report-btn" type="button"
                                                th:data-reply-id="${reply.id}"
                                                th:unless="${user == null}"
                                                title="Report">
                                            <i class="bi bi-flag"></i>
                                        </button>

                                        <form th:if="${user != null and user.role == 'ADMIN'}"
                                              th:action="@{/admin/delete-comment}"
                                              method="post"
                                              class="d-inline"
                                              onsubmit="return confirm('Вы уверены, что хотите удалить этот ответ?');">
                                            <input type="hidden" name="replyId" th:value="${reply.id}">
                                            <input type="hidden" name="recipeId" th:value="${recipe.id}">
                                            <button type="submit" class="comment-action-btn text-danger">
                                                <i class="bi bi-trash"></i> Delete
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>

                </div>

            </div>

        </div>

        <section class="rating-section my-4">
            <div class="container">
                <div class="card p-4 text-center border-0 shadow-sm">
                    <h4 class="mb-2">Rate this recipe</h4>
                    <p class="text-muted small mb-3">Leave your rating to help others!</p>

                    <div class="user-rating-stars d-flex justify-content-center gap-2 fs-3 text-warning cursor-pointer"
                         th:data-recipe-id="${recipe.id}">
                        <i class="bi bi-star js-star" data-score="1"></i>
                        <i class="bi bi-star js-star" data-score="2"></i>
                        <i class="bi bi-star js-star" data-score="3"></i>
                        <i class="bi bi-star js-star" data-score="4"></i>
                        <i class="bi bi-star js-star" data-score="5"></i>
                    </div>
                </div>
            </div>
        </section>

        <section class="write-comment-section">
            <div class="container">

                <div class="write-comment-header">
                    <h3 class="write-comment-title">Write a comment</h3>
                </div>

                <div id="reply-status-container" class="reply-status-alert d-none flex-column gap-1 mb-2 p-2 px-3 rounded" style="background-color: #f1f3f5; border-left: 4px solid #adb5bd;">
                    <div class="d-flex align-items-center justify-content-between w-100">
        <span class="text-secondary small">
            Replying to <strong id="reply-target-name" class="text-dark">Denis</strong>
        </span>
                        <button id="cancel-reply-btn" type="button" class="btn btn-sm btn-link text-danger p-0 text-decoration-none small">
                            <i class="bi bi-x-circle-fill me-1"></i>Cancel
                        </button>
                    </div>
                    <div id="reply-target-text" class="text-muted small text-truncate" style="max-width: 100%;"></div>
                </div>

                <form th:if="${user != null}" th:action="@{/comment-post}" method="post" class="comment-form-card">
    <textarea id="comment-textarea" name="text" class="comment-textarea"
              placeholder="Write your comment here..." required></textarea>

                    <input name="recipeId" th:value="${recipe.id}" style="display: none;">
                    <input id="commentId" name="commentId" type="hidden" value="">

                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn post-comment-btn">Post comment</button>
                    </div>
                </form>

                <div th:unless="${user != null}" class="comment-form-card">
                    <textarea id="draft-comment" class="comment-textarea" placeholder="Write your comment here..."></textarea>

                    <div class="d-flex justify-content-end">
                        <button type="button" data-bs-toggle="modal" data-bs-target="#loginModal" class="btn post-comment-btn">
                            Post comment
                        </button>
                    </div>
                </div>

            </div>
        </section>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
    <div id="ratingToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex alert alert-success m-0 p-0">
            <div class="toast-body d-flex align-items-center gap-2">
                <span id="toastMessage"></span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<div class="modal fade" id="reportModal" tabindex="-1" aria-labelledby="reportModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="reportModalLabel">Report Comment</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="report-form">
                <div class="modal-body">
                    <input type="hidden" id="reportCommentId" name="commentId" value="">
                    <input type="hidden" id="reportReplyId" name="replyId" value="">

                    <div class="mb-3">
                        <label for="reportReason" class="form-label font-weight-bold">Select a reason:</label>
                        <select class="form-select" id="reportReason" name="reason" required>
                            <option value="" selected disabled>Choose reason...</option>
                            <option value="SPAM">Spam or advertising</option>
                            <option value="INSULT">Insult or hate speech</option>
                            <option value="MISINFORMATION">Misinformation</option>
                            <option value="OTHER">Other</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="reportDetails" class="form-label">Details (optional):</label>
                        <textarea class="form-control" id="reportDetails" name="details" rows="3"
                                  placeholder="Provide additional information if needed..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-danger">Submit Report</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/header :: modalSignUp}"></div>

<div th:replace="~{fragments/header :: modalRegister}"></div>

<div th:replace="~{fragments/header :: modalForgot}"></div>

<!-- likes -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const likeButtons = document.querySelectorAll(".js-like-btn");

        likeButtons.forEach(button => {
            button.addEventListener("click", function () {
                const commentId = this.getAttribute("data-comment-id");
                const icon = this.querySelector("i");
                const countSpan = this.querySelector(".likes-count");

                checkBanAndExecute(() => {
                    fetch(`/like-comment?commentId=${commentId}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded'
                        }
                    })
                        .then(response => {
                            // Если сервер ответил 401 (не авторизован)
                            if (response.status === 401) {
                                // Здесь в будущем вызовите открытие вашего модального окна регистрации/входа, например:
                                // openAuthModal();
                                alert("Пожалуйста, войдите в аккаунт, чтобы ставить лайки!");
                                throw new Error("Unauthorized");
                            }

                            // Если сервер ответил 404 (комментарий удален)
                            if (response.status === 404) {
                                alert("Этот комментарий больше не существует.");
                                throw new Error("Comment not found");
                            }

                            if (!response.ok) {
                                throw new Error("Network response was not ok");
                            }

                            return response.json();
                        })
                        .then(data => {
                            // Извлекаем "likes" и "liked" из вашей мапы
                            countSpan.textContent = data.likes;

                            if (data.liked) {
                                // Если лайк успешно поставлен
                                this.classList.add("text-danger");
                                icon.classList.remove("bi-heart");
                                icon.classList.add("bi-heart-fill");
                            } else {
                                // Если лайк успешно убран
                                this.classList.remove("text-danger");
                                icon.classList.remove("bi-heart-fill");
                                icon.classList.add("bi-heart");
                            }
                        })
                        .catch(error => {
                            console.error("Ошибка при отправке лайка:", error);
                        });
                });
            });
        });
    });
</script>

<!-- favs -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const favButton = document.getElementById("fav-btn");

        if (favButton) {
            favButton.addEventListener("click", function () {
                const recipeId = this.getAttribute("data-recipe-id");
                const icon = this.querySelector("i");

                checkBanAndExecute(() => {
                    fetch(`/save-recipe?recipeId=${recipeId}`, {
                        method: 'POST'
                    })
                        .then(response => {
                            if (response.status === 401) {
                                alert("Please, sign in to save recipe!");
                                throw new Error("Unauthorized");
                            }
                            if (response.status === 404) {
                                alert("Recipe not found");
                                throw new Error("Recipe not found");
                            }
                            if (!response.ok) {
                                throw new Error("Network response was not ok");
                            }
                            return response.json();
                        })
                        .then(data => {
                            if (data.saved) {
                                icon.classList.remove("bi-bookmark");
                                icon.classList.add("bi-bookmark-fill", "text-warning");
                            } else {
                                icon.classList.remove("bi-bookmark-fill", "text-warning");
                                icon.classList.add("bi-bookmark");
                            }
                        })
                        .catch(error => {
                            console.error("Error:", error);
                        });
                });
            });
        }
    });
</script>

<!-- replies -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const replyButtons = document.querySelectorAll(".js-reply-btn");
        const commentIdInput = document.getElementById("commentId");

        const replyStatusContainer = document.getElementById("reply-status-container");
        const replyTargetName = document.getElementById("reply-target-name");
        const replyTargetText = document.getElementById("reply-target-text"); // Добавлено
        const cancelReplyBtn = document.getElementById("cancel-reply-btn");
        const commentTextarea = document.getElementById("comment-textarea");

        replyButtons.forEach(button => {
            button.addEventListener("click", function () {
                const commentId = this.getAttribute("data-comment-id");
                const authorName = this.getAttribute("data-author-name");
                const commentText = this.getAttribute("data-comment-text");

                // Оборачиваем подготовку ответа в проверку бана
                checkBanAndExecute(() => {
                    if (commentIdInput) commentIdInput.value = commentId || "";

                    if (replyStatusContainer && replyTargetName) {
                        replyTargetName.textContent = authorName;
                        if (replyTargetText) replyTargetText.textContent = commentText;
                        replyStatusContainer.classList.remove("d-none");
                        replyStatusContainer.classList.add("d-flex");
                    }

                    if (commentTextarea) {
                        const mention = `@${authorName}, `;
                        if (!commentTextarea.value.startsWith(mention)) {
                            commentTextarea.value = mention + commentTextarea.value.replace(/^@[^,]+,\s*/, '');
                        }
                        commentTextarea.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        commentTextarea.focus();
                    }
                });
            });
        });

        function cancelReply() {
            if (commentIdInput) commentIdInput.value = "";

            if (replyStatusContainer) {
                replyStatusContainer.classList.add("d-none");
                replyStatusContainer.classList.remove("d-flex");
            }

            // Очищаем текст в плашке при отмене
            if (replyTargetText) {
                replyTargetText.textContent = "";
            }

            if (commentTextarea) {
                commentTextarea.value = commentTextarea.value.replace(/^@[^,]+,\s*/, '');
            }
        }

        if (cancelReplyBtn) {
            cancelReplyBtn.addEventListener("click", cancelReply);
        }
    });
</script>

<!-- textarea -->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const DRAFT_KEY = 'pending_comment_draft';

        const loginForm = document.getElementById('login-form');
        const draftTextarea = document.getElementById('draft-comment');
        const authCommentTextarea = document.getElementById('comment-textarea');

        if (loginForm) {
            loginForm.addEventListener('submit', function () {
                if (draftTextarea && draftTextarea.value.trim() !== '') {
                    localStorage.setItem(DRAFT_KEY, draftTextarea.value);
                }
            });
        }

        const savedComment = localStorage.getItem(DRAFT_KEY);

        if (savedComment) {
            if (authCommentTextarea) {
                authCommentTextarea.value = savedComment;
                localStorage.removeItem(DRAFT_KEY);

                authCommentTextarea.scrollIntoView({ behavior: 'smooth', block: 'center' });
                authCommentTextarea.focus();
            }
            else if (draftTextarea) {
                draftTextarea.value = savedComment;
                draftTextarea.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
    });
</script>

<!-- rating -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const ratingContainer = document.querySelector(".user-rating-stars");
        if (!ratingContainer) return;

        const stars = ratingContainer.querySelectorAll(".js-star");
        const recipeId = ratingContainer.getAttribute("data-recipe-id");

        // Функция отрисовки звёзд
        function renderStars(score) {
            stars.forEach((star) => {
                const starScore = parseInt(star.getAttribute("data-score"));
                if (starScore <= score) {
                    star.classList.remove("bi-star");
                    star.classList.add("bi-star-fill");
                } else {
                    star.classList.remove("bi-star-fill");
                    star.classList.add("bi-star");
                }
            });
        }

        // При наведении — подсвечиваем звёзды до текущей
        stars.forEach((star) => {
            star.addEventListener("mouseover", function () {
                const score = parseInt(this.getAttribute("data-score"));
                renderStars(score);
            });

            // Отправка оценки на сервер
            star.addEventListener("click", function () {
                const score = parseInt(this.getAttribute("data-score"));

                checkBanAndExecute(() => {
                    fetch(`/rate-recipe?recipeId=${recipeId}&score=${score}`, {
                        method: 'POST'
                    })
                        .then(response => {
                            if (response.status === 401) {
                                const modal = new bootstrap.Modal(document.getElementById('loginModal'));
                                modal.show();
                                throw new Error("Unauthorized");
                            }
                            if (!response.ok) throw new Error("Rating error");
                            return response.json();
                        })
                        .then(data => {
                            // Обновляем сохраненную оценку пользователя в атрибуте
                            ratingContainer.setAttribute("data-user-score", data.userScore);
                            renderStars(data.userScore);

                            const toastElement = document.getElementById('ratingToast');
                            const toastMessage = document.getElementById("toastMessage")

                            if (toastElement) {
                                toastMessage.textContent = `Your rating has been saved!`;
                                const toast = new bootstrap.Toast(toastElement, {delay: 5000});
                                toast.show();
                            }
                        })
                        .catch(err => console.error(err));
                });
            });
        });

        // Когда убираем курсор — возвращаем сохраненную оценку пользователя
        ratingContainer.addEventListener("mouseleave", function () {
            const currentUserScore = parseInt(this.getAttribute("data-user-score")) || 0;
            renderStars(currentUserScore);
        });
    });
</script>

<!-- reports -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const reportButtons = document.querySelectorAll(".js-report-btn");
        const reportModalElement = document.getElementById("reportModal");
        const reportForm = document.getElementById("report-form");

        if (!reportModalElement || !reportForm) return;

        const reportModal = new bootstrap.Modal(reportModalElement);
        const commentIdInput = document.getElementById("reportCommentId");
        const replyIdInput = document.getElementById("reportReplyId");

        reportButtons.forEach(button => {
            button.addEventListener("click", function () {
                const commentId = this.getAttribute("data-comment-id");
                const replyId = this.getAttribute("data-reply-id");

                reportForm.reset();
                commentIdInput.value = commentId || "";
                replyIdInput.value = replyId || "";

                reportModal.show();
            });
        });

        // Отправка формы через AJAX
        reportForm.addEventListener("submit", function (e) {
            e.preventDefault();

            const commentId = commentIdInput.value;
            const replyId = replyIdInput.value;
            const reason = document.getElementById("reportReason").value;
            const details = document.getElementById("reportDetails").value;

            // Формируем параметры запроса
            const params = new URLSearchParams();
            if (commentId) params.append("commentId", commentId);
            if (replyId) params.append("replyId", replyId);
            params.append("reason", reason);
            params.append("details", details);

            const csrfToken = document.querySelector("meta[name='_csrf']")?.getAttribute("content");
            const csrfHeader = document.querySelector("meta[name='_csrf_header']")?.getAttribute("content");

            checkBanAndExecute(() => {
                fetch("/report-comment", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded",
                        [csrfHeader]: csrfToken
                    },
                    body: params
                })
                    .then(response => {
                        if (response.status === 401) {
                            reportModal.hide();
                            alert("Please sign in to report comments.");
                            throw new Error("Unauthorized");
                        }
                        if (!response.ok) {
                            throw new Error("Failed to send report" + response.status);
                        }
                        return response;
                    })
                    .then(() => {
                        reportModal.hide();

                        const toastElement = document.getElementById('ratingToast');
                        const toastMessage = document.getElementById("toastMessage");

                        if (toastElement && toastMessage) {
                            toastMessage.textContent = "Thank you! Your report has been submitted.";
                            const toast = new bootstrap.Toast(toastElement, {delay: 4000});
                            toast.show();
                        }
                    })
                    .catch(error => {
                        console.error("Error sending report:", error);
                    });
            });
        });
    });
</script>

<!-- post comment -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const commentForm = document.querySelector('form[action$="/comment-post"]');

        if (commentForm) {
            commentForm.addEventListener("submit", function (e) {
                e.preventDefault();

                checkBanAndExecute(() => {
                    commentForm.submit();
                });
            });
        }
    });
</script>
