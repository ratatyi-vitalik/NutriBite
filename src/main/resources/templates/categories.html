<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Категории рецептов — NutriBite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<main class="flex-grow-1 py-5">
    <div class="container">

        <div class="text-center mb-5">
            <h1 class="h2 fw-bold text-dark mb-2">Категории рецептов</h1>
            <p class="text-muted">Выберите категорию, чтобы найти подходящие блюда</p>
        </div>

        <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-4 justify-content-center">

            <div class="col text-center" th:each="category : ${categories}">

                <a th:href="@{/category(categoryId=${category.id})}" class="text-decoration-none group d-block">

                    <div class="card border-0 shadow-sm rounded-circle p-2 mx-auto mb-3 bg-white hover-lift" style="width: 130px; height: 130px;">
                        <div class="w-100 h-100 rounded-circle overflow-hidden">
                            <img th:src="@{{path}(path=${category.imagePath})}"
                                 th:alt="${category.name}"
                                 class="w-100 h-100 object-fit-cover">
                        </div>
                    </div>

                    <span class="fw-semibold text-dark h6 d-block" th:text="${category.name}">Название категории</span>

                </a>

            </div>

        </div>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<div th:replace="~{fragments/header :: modalSignUp}"></div>
<div th:replace="~{fragments/header :: modalRegister}"></div>
<div th:replace="~{fragments/header :: modalForgot}"></div>

<div th:replace="~{fragments/footer :: successToast}"></div>
<div th:replace="~{fragments/footer :: errorToast}"></div>
<script th:replace="~{fragments/footer :: toastScript}"></script>

<script th:replace="~{fragments/header :: searchScript}"></script>
<script th:replace="~{fragments/header :: openLoginScript}"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
