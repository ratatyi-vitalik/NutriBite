<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div th:replace="~{fragments/header :: navbar}"></div>

    <main class="all-categories-section">
        <div class="container">

            <h1 class="page-title-categories">Categories</h1>

            <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-5 justify-content-start">

                <div class="col d-flex justify-content-center" th:each="category : ${categories}">

                    <a th:href="@{/category(categoryId=${category.id})}" class="grid-category-item">

                        <div class="grid-category-img-container">
                            <img th:src="@{{path}(path=${category.imagePath})}"
                                 th:alt="${category.name}"
                                 class="grid-category-img">
                        </div>

                        <span class="grid-category-title" th:text="${category.name}">Category Name</span>

                    </a>

                </div>

            </div>

        </div>
    </main>

    <div th:replace="~{fragments/header :: modalSignUp}"></div>

    <div th:replace="~{fragments/header :: modalRegister}"></div>

    <script th:replace="~{fragments/header :: searchScript}"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
