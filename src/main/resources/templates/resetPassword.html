<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сброс пароля — NutriBite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<header th:replace="~{fragments/header :: navbar}"></header>

<main class="profile-section flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="container" style="max-width: 440px;">

        <div class="card border-0 shadow-sm p-4 p-md-5 rounded-3 bg-white">
            <div class="text-center mb-4">
                <div class="mb-3 text-success">
                    <i class="bi bi-shield-lock display-4"></i>
                </div>
                <h1 class="h4 fw-bold text-dark">Новый пароль</h1>
                <p class="text-muted font-size-14 mt-2">Придумайте и введите новый пароль для доступа к вашему аккаунту.</p>
            </div>

            <form th:action="@{/reset-password}" method="POST" class="profile-form">
                <input type="hidden" name="token" th:value="${token}">

                <div class="input-group-custom form-group-custom border rounded-3 p-2 d-flex align-items-center mb-3">
                    <i class="bi bi-lock text-muted me-2"></i>
                    <input type="password"
                           class="form-control border-0 shadow-none p-0"
                           name="newPassword"
                           id="newPassword"
                           placeholder="Введите новый пароль"
                           required>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-success rounded-pill w-100 py-2 fw-semibold">Сохранить пароль</button>
                </div>
            </form>
        </div>

    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
