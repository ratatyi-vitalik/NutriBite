<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Tastebite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<header class="custom-navbar" th:fragment="navbar">
    <div class="container">
        <div class="row align-items-center">

            <div class="col-3 col-lg-2">
                <a href="/">
                    <img th:src="@{/icons/Logo.svg}" alt="logo">
                </a>
            </div>

        </div>
    </div>
</header>

<main class="profile-section flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="container" style="max-width: 480px;">

        <div class="text-center mb-4">
            <h1 class="profile-header-title">Enter New Password</h1>
            <p class="text-muted small mt-2">Please enter your new password below to reset your account credentials.</p>
        </div>

        <form th:action="@{/reset-password}" method="POST" class="profile-form">
            <input type="hidden" name="token" th:value="${token}">

            <div class="input-group-custom form-group-custom">
                <i class="bi bi-lock"></i>
                <input type="password"
                       class="form-control-custom"
                       name="newPassword"
                       id="newPassword"
                       placeholder="New Password"
                       required>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-tb-orange w-100">Save Password</button>
            </div>
        </form>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
